<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Tracker</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#6c63ff">
<style>
  :root{
    --bg:#f6f7fb; --card:#ffffff; --text:#1f2430; --muted:#7b8294; --line:#e8eaf2;
    --accent:#6c63ff; --accent2:#8f87ff; --good:#2ec4a6; --warn:#ff9f43; --bad:#ff6b6b;
    --shadow:0 6px 24px rgba(40,50,90,.08);
  }
  [data-theme="dark"]{
    --bg:#12141c; --card:#1b1e29; --text:#eef0f7; --muted:#8c93a8; --line:#2a2e3d;
    --shadow:0 6px 24px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;transition:background .3s,color .3s}
  .wrap{max-width:1100px;margin:0 auto;padding:24px 16px 60px}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:12px;flex-wrap:wrap}
  h1{font-size:1.6rem;letter-spacing:-.5px}
  h1 span{color:var(--accent)}
  .sub{color:var(--muted);font-size:.9rem;margin-top:2px}
  .icon-btn{background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:10px 14px;cursor:pointer;font-size:1rem;box-shadow:var(--shadow)}
  .grid{display:grid;grid-template-columns:1.6fr 1fr;gap:20px}
  @media(max-width:860px){.grid{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:var(--shadow)}
  .card h2{font-size:1.05rem;margin-bottom:14px}
  .vibes{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;margin-bottom:20px}
  .vibes .q{font-size:1.15rem;font-weight:600;line-height:1.45}
  .vibes .a{opacity:.85;font-size:.85rem;margin-top:8px}
  .vibes button{margin-top:12px;background:rgba(255,255,255,.2);border:none;color:#fff;padding:7px 14px;border-radius:10px;cursor:pointer}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
  .stat{text-align:center;padding:14px 8px}
  .stat b{display:block;font-size:1.5rem;color:var(--accent)}
  .stat small{color:var(--muted)}
  .bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:20px}
  .bar div{height:100%;width:0;background:linear-gradient(90deg,var(--good),var(--accent));transition:width .4s}
  form{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
  form .full{grid-column:1/-1}
  input,select{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:.95rem;outline:none}
  input:focus,select:focus{border-color:var(--accent)}
  .primary{background:var(--accent);color:#fff;border:none;padding:12px;border-radius:12px;font-weight:600;cursor:pointer;font-size:.95rem}
  .primary:hover{background:var(--accent2)}
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .chip{padding:6px 14px;border-radius:99px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;font-size:.85rem}
  .chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  ul{list-style:none;display:grid;gap:10px}
  li.task{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--bg);animation:pop .25s}
  @keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  li.task input[type=checkbox]{width:20px;height:20px;accent-color:var(--good);flex:none}
  .info{flex:1;min-width:0}
  .title{font-weight:600;word-break:break-word}
  .meta{font-size:.78rem;color:var(--muted);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap}
  .tag{padding:1px 8px;border-radius:99px;font-size:.72rem;font-weight:600;color:#fff}
  .tag.hw{background:var(--accent)} .tag.task{background:var(--good)}
  .p-high{color:var(--bad)} .p-med{color:var(--warn)} .p-low{color:var(--good)}
  .overdue{color:var(--bad);font-weight:600}
  li.done .title{text-decoration:line-through;color:var(--muted)}
  .del{background:none;border:none;color:var(--muted);cursor:pointer;font-size:1.1rem}
  .del:hover{color:var(--bad)}
  .empty{text-align:center;color:var(--muted);padding:24px 0}
  /* timer */
  .modes{display:flex;gap:6px;justify-content:center;margin-bottom:14px}
  .ring{position:relative;width:210px;height:210px;margin:0 auto 14px}
  .ring svg{transform:rotate(-90deg)}
  .ring circle{fill:none;stroke-width:10}
  .ring .bg{stroke:var(--line)}
  .ring .fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .5s linear}
  .time{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:2.6rem;font-weight:700;font-variant-numeric:tabular-nums}
  .time small{font-size:.8rem;color:var(--muted);font-weight:500}
  .tbtns{display:flex;gap:10px;justify-content:center}
  .tbtns button{padding:10px 22px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);cursor:pointer;font-weight:600}
  .tbtns .primary{border:none;color:#fff}
  .custom{display:flex;gap:8px;margin-top:14px;align-items:center;font-size:.82rem;color:var(--muted);justify-content:center}
  .custom input{width:58px;padding:6px}
  .sessions{text-align:center;margin-top:12px;color:var(--muted);font-size:.85rem}
  .hist-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  .hist-head h2{margin:0}
  .hist-sum{color:var(--muted);font-size:.85rem;margin-bottom:12px}
  .hist-day{font-size:.8rem;font-weight:700;color:var(--accent);margin:14px 0 6px}
  .hist-item{display:flex;gap:10px;align-items:center;padding:9px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:6px;font-size:.9rem}
  .hist-item .t{flex:1;min-width:0;word-break:break-word}
  .hist-item .w{color:var(--muted);font-size:.78rem;white-space:nowrap}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--text);color:var(--bg);padding:12px 20px;border-radius:14px;transition:transform .3s;z-index:9}
  .toast.show{transform:translateX(-50%)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>My <span>Tracker</span></h1>
      <div class="sub" id="today"></div>
    </div>
    <button class="icon-btn" id="themeBtn" title="Toggle dark mode">🌙</button>
  </header>

  <div class="card vibes">
    <div class="q" id="quote"></div>
    <div class="a" id="author"></div>
    <button id="newQuote">✨ New vibe</button>
  </div>

  <div class="grid">
    <div>
      <div class="stats">
        <div class="card stat"><b id="sTotal">0</b><small>Total</small></div>
        <div class="card stat"><b id="sDone">0</b><small>Done</small></div>
        <div class="card stat"><b id="sDue">0</b><small>Due today</small></div>
      </div>
      <div class="bar"><div id="progress"></div></div>

      <div class="card">
        <h2>Add a task or homework</h2>
        <form id="form">
          <input class="full" id="title" placeholder="What do you need to do?" required maxlength="120">
          <select id="type"><option value="hw">📚 Homework</option><option value="task">✅ Task</option></select>
          <input id="subject" placeholder="Subject (optional)" maxlength="40">
          <input type="date" id="due">
          <select id="priority"><option value="med">Medium priority</option><option value="high">High priority</option><option value="low">Low priority</option></select>
          <button class="primary full" type="button" id="addBtn">Add</button>
        </form>

        <div class="filters" id="filters">
          <button class="chip on" data-f="all">All</button>
          <button class="chip" data-f="hw">Homework</button>
          <button class="chip" data-f="task">Tasks</button>
          <button class="chip" data-f="active">Active</button>
          <button class="chip" data-f="done">Done</button>
        </div>
        <ul id="list"></ul>
        <div style="text-align:right;margin-top:12px"><button class="chip" id="clearDone">Clear completed</button></div>
      </div>
    </div>

    <div class="card" style="align-self:start">
      <h2>⏱ Focus timer</h2>
      <div class="modes" id="modes">
        <button class="chip on" data-m="focus">Focus</button>
        <button class="chip" data-m="short">Short break</button>
        <button class="chip" data-m="long">Long break</button>
      </div>
      <div class="ring">
        <svg width="210" height="210" viewBox="0 0 210 210">
          <circle class="bg" cx="105" cy="105" r="95"/>
          <circle class="fg" id="fg" cx="105" cy="105" r="95" stroke-dasharray="597" stroke-dashoffset="0"/>
        </svg>
        <div class="time"><span id="clock">25:00</span><small id="modeLabel">Focus</small></div>
      </div>
      <div class="tbtns">
        <button class="primary" id="startBtn">Start</button>
        <button id="resetBtn">Reset</button>
      </div>
      <div class="custom">
        Focus <input type="number" id="cFocus" min="1" max="120" value="25"> Short <input type="number" id="cShort" min="1" max="60" value="5"> Long <input type="number" id="cLong" min="1" max="60" value="15">
      </div>
      <div class="sessions" id="sessions">Focus sessions today: 0</div>
    </div>
  </div>

  <div class="card" style="margin-top:20px">
    <div class="hist-head">
      <h2>📜 History</h2>
      <button class="chip" id="clearHist">Clear history</button>
    </div>
    <div class="hist-sum" id="histSum"></div>
    <div id="histList"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const load = (k,d) => { try{ const v = JSON.parse(localStorage.getItem(k)); return v ?? d; }catch(e){ return d; } };
  const save = (k,v) => { try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} };
  const todayStr = () => { const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
  const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2600); }

  // ---------- Theme ----------
  let theme = load('fp_theme','light');
  function applyTheme(){ document.documentElement.setAttribute('data-theme',theme); $('themeBtn').textContent = theme==='dark'?'☀️':'🌙'; }
  $('themeBtn').onclick = () => { theme = theme==='dark'?'light':'dark'; save('fp_theme',theme); applyTheme(); };
  applyTheme();
  $('today').textContent = new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'});

  // ---------- Good vibes ----------
  const quotes = [
    ["Small steps every day add up to big results.","Unknown"],
    ["You don't have to be perfect, just consistent.","Unknown"],
    ["The secret of getting ahead is getting started.","Mark Twain"],
    ["Don't watch the clock; do what it does. Keep going.","Sam Levenson"],
    ["Future you is cheering for you right now. 💪","Unknown"],
    ["One task at a time. You've got this.","Unknown"],
    ["Discipline is choosing what you want most over what you want now.","Abraham Lincoln"],
    ["Progress, not perfection.","Unknown"],
    ["قليلٌ دائم خير من كثيرٍ منقطع","حكمة عربية"],
    ["من جدّ وجد ومن زرع حصد","حكمة عربية"],
    ["ابدأ من حيث أنت، بما لديك، وافعل ما تستطيع","آرثر آش"],
    ["Rest is part of the work. Take your break. 🌿","Unknown"],
    ["Every expert was once a beginner.","Unknown"],
    ["Your only limit is you. Go crush it today. 🚀","Unknown"]
  ];
  let qi = Math.floor(Math.random()*quotes.length);
  function showQuote(){ $('quote').textContent = '“'+quotes[qi][0]+'”'; $('author').textContent = '— '+quotes[qi][1]; }
  $('newQuote').onclick = () => { let n; do{ n=Math.floor(Math.random()*quotes.length);}while(n===qi); qi=n; showQuote(); };
  showQuote();

  // ---------- Tasks ----------
  let tasks = load('fp_tasks',[]);
  let history = load('fp_history',[]);
  let filter = 'all';

  function saveHistory(){ if(history.length>500) history = history.slice(-500); save('fp_history',history); renderHistory(); }
  function logTask(t){ history = history.filter(h=>h.id!==t.id); history.push({id:t.id,kind:'task',ttype:t.type,title:t.title,subject:t.subject||'',at:new Date().toISOString()}); saveHistory(); }
  function unlogTask(t){ history = history.filter(h=>h.id!==t.id); saveHistory(); }
  function logFocus(min){ history.push({id:'f'+Date.now(),kind:'focus',minutes:min,at:new Date().toISOString()}); saveHistory(); }
  function dayKey(iso){ const d=new Date(iso); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function renderHistory(){
    const box=$('histList'); box.innerHTML='';
    const doneTasks = history.filter(h=>h.kind==='task').length;
    const mins = history.filter(h=>h.kind==='focus').reduce((a,h)=>a+(h.minutes||0),0);
    $('histSum').textContent = doneTasks+' completed · '+history.filter(h=>h.kind==='focus').length+' focus sessions · '+mins+' focus minutes in total';
    if(!history.length){ box.innerHTML='<div class="empty">Your history will appear here as you finish tasks and focus sessions ✨</div>'; return; }
    const items = history.slice().sort((a,b)=> a.at<b.at?1:-1);
    let lastDay='';
    items.forEach(h=>{
      const dk=dayKey(h.at);
      if(dk!==lastDay){
        lastDay=dk;
        const d=document.createElement('div'); d.className='hist-day';
        d.textContent = dk===todayStr() ? 'Today' : new Date(h.at).toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'});
        box.appendChild(d);
      }
      const row=document.createElement('div'); row.className='hist-item';
      const time=new Date(h.at).toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'});
      row.innerHTML = h.kind==='focus'
        ? '<span>⏱</span><span class="t">Focus session · '+h.minutes+' min</span><span class="w">'+time+'</span>'
        : '<span>'+(h.ttype==='hw'?'📚':'✅')+'</span><span class="t">'+esc(h.title)+(h.subject?' <span class="w">· '+esc(h.subject)+'</span>':'')+'</span><span class="w">'+time+'</span>';
      box.appendChild(row);
    });
  }
  let clearArmed=false;
  $('clearHist').onclick = () => {
    if(!history.length){ toast('History is already empty'); return; }
    if(!clearArmed){ clearArmed=true; $('clearHist').textContent='Click again to confirm'; setTimeout(()=>{ clearArmed=false; $('clearHist').textContent='Clear history'; },3500); return; }
    clearArmed=false; $('clearHist').textContent='Clear history'; history=[]; saveHistory(); toast('History cleared 🧹');
  };
  const pLabel = {high:'High',med:'Medium',low:'Low'};

  function render(){
    const list = $('list'); list.innerHTML='';
    const t0 = todayStr();
    let shown = tasks.filter(t => {
      if(filter==='hw') return t.type==='hw';
      if(filter==='task') return t.type==='task';
      if(filter==='active') return !t.done;
      if(filter==='done') return t.done;
      return true;
    });
    shown.sort((a,b)=> (a.done-b.done) || ((a.due||'9999')>(b.due||'9999')?1:-1));
    if(!shown.length){ list.innerHTML='<div class="empty">Nothing here yet. Add something above ✨</div>'; }
    shown.forEach(t => {
      const li = document.createElement('li');
      li.className = 'task'+(t.done?' done':'');
      const overdue = t.due && !t.done && t.due < t0;
      li.innerHTML =
        '<input type="checkbox" '+(t.done?'checked':'')+'>'+
        '<div class="info"><div class="title">'+esc(t.title)+'</div>'+
        '<div class="meta"><span class="tag '+t.type+'">'+(t.type==='hw'?'Homework':'Task')+'</span>'+
        (t.subject?'<span>'+esc(t.subject)+'</span>':'')+
        (t.due?'<span class="'+(overdue?'overdue':'')+'">'+(overdue?'Overdue · ':'Due ')+t.due+'</span>':'')+
        '<span class="p-'+t.priority+'">● '+pLabel[t.priority]+'</span></div></div>'+
        '<button class="del" title="Delete">✕</button>';
      li.querySelector('input').onchange = e => {
        t.done = e.target.checked; save('fp_tasks',tasks); render();
        if(t.done) logTask(t); else unlogTask(t);
        if(t.done) toast(['Nice work! 🎉','Crushed it! 💥','One down! ✅','Proud of you! 🌟'][Math.floor(Math.random()*4)]);
      };
      li.querySelector('.del').onclick = () => { tasks = tasks.filter(x=>x.id!==t.id); save('fp_tasks',tasks); render(); };
      list.appendChild(li);
    });
    const done = tasks.filter(t=>t.done).length;
    $('sTotal').textContent = tasks.length;
    $('sDone').textContent = done;
    $('sDue').textContent = tasks.filter(t=>!t.done && t.due===t0).length;
    $('progress').style.width = tasks.length ? (done/tasks.length*100)+'%' : '0%';
  }

  function addTask(){
    const title = $('title').value.trim();
    if(!title){ toast('Type what you need to do first ✍️'); $('title').focus(); return; }
    tasks.push({ id:Date.now()+Math.random(), title, type:$('type').value, subject:$('subject').value.trim(), due:$('due').value, priority:$('priority').value, done:false });
    save('fp_tasks',tasks);
    $('title').value=''; $('subject').value=''; $('due').value='';
    render(); $('title').focus();
  }
  $('addBtn').onclick = addTask;
  $('form').addEventListener('submit', e => e.preventDefault());
  ['title','subject','due'].forEach(id => $(id).addEventListener('keydown', e => { if(e.key==='Enter'){ e.preventDefault(); addTask(); } }));
  $('filters').onclick = e => {
    const b = e.target.closest('.chip'); if(!b) return;
    filter = b.dataset.f;
    [...$('filters').children].forEach(c=>c.classList.toggle('on',c===b));
    render();
  };
  $('clearDone').onclick = () => {
    if(!tasks.some(t=>t.done)){ toast('No completed items to clear'); return; }
    tasks = tasks.filter(t=>!t.done); save('fp_tasks',tasks); render(); toast('Completed items cleared 🧹');
  };
  render();
  renderHistory();

  // ---------- Timer ----------
  const cfg = load('fp_timer',{focus:25,short:5,long:15});
  $('cFocus').value=cfg.focus; $('cShort').value=cfg.short; $('cLong').value=cfg.long;
  const labels = {focus:'Focus',short:'Short break',long:'Long break'};
  const CIRC = 597;
  let mode='focus', total=cfg.focus*60, left=total, running=false, endAt=0, iv=null;
  const sess = load('fp_sessions',{date:todayStr(),n:0});
  if(sess.date!==todayStr()){ sess.date=todayStr(); sess.n=0; }

  function fmt(s){ return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
  function draw(){
    $('clock').textContent = fmt(left);
    $('modeLabel').textContent = labels[mode];
    $('fg').style.strokeDashoffset = CIRC*(1-left/total);
    $('sessions').textContent = 'Focus sessions today: '+sess.n;
    document.title = running ? fmt(left)+' · '+labels[mode] : 'My Tracker';
  }
  function setMode(m){
    mode=m; stop(); total=cfg[m]*60; left=total;
    [...$('modes').children].forEach(c=>c.classList.toggle('on',c.dataset.m===m));
    draw();
  }
  function beep(){
    try{
      const ctx=new (window.AudioContext||window.webkitAudioContext)();
      [0,.25,.5].forEach(d=>{ const o=ctx.createOscillator(),g=ctx.createGain(); o.connect(g); g.connect(ctx.destination); o.frequency.value=660; g.gain.value=.15; o.start(ctx.currentTime+d); o.stop(ctx.currentTime+d+.15); });
    }catch(e){}
  }
  function tick(){
    left = Math.max(0, Math.round((endAt-Date.now())/1000));
    if(left<=0){
      stop(); beep();
      if(mode==='focus'){ sess.n++; save('fp_sessions',sess); logFocus(cfg.focus); toast('Focus session done! Take a break 🌿'); setMode(sess.n%4===0?'long':'short'); }
      else { toast('Break over. Ready to focus? 🚀'); setMode('focus'); }
      return;
    }
    draw();
  }
  function start(){ if(running) return; running=true; endAt=Date.now()+left*1000; iv=setInterval(tick,250); $('startBtn').textContent='Pause'; }
  function stop(){ running=false; clearInterval(iv); $('startBtn').textContent='Start'; }
  $('startBtn').onclick = () => { if(running){ stop(); draw(); } else start(); };
  $('resetBtn').onclick = () => { stop(); left=total; draw(); };
  $('modes').onclick = e => { const b=e.target.closest('.chip'); if(b) setMode(b.dataset.m); };
  ['cFocus','cShort','cLong'].forEach((id,i)=>{
    $(id).onchange = () => {
      const key=['focus','short','long'][i];
      let v=parseInt($(id).value,10); if(!v||v<1) v=cfg[key]; cfg[key]=Math.min(v,120); $(id).value=cfg[key];
      save('fp_timer',cfg); if(!running && mode===key) setMode(mode);
    };
  });
  draw();
})();
</script>
</body>
</html>
